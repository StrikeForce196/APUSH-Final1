<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APUSH HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lamp-bg: #0d0d14;
    --lamp-glow: #6366f1;
    --lamp-glow2: #818cf8;
    --text-primary: #f1f0ff;
    --text-secondary: #a5b4fc;
  }

  html { scroll-behavior: smooth; }

  /* ── HERO SECTION ── */
  #apush-hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    background: var(--lamp-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 0;
  }

  /* Lamp cone + glow */
  .lamp-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 900px;
    pointer-events: none;
  }

  .lamp-cone {
    width: 100%;
    height: 420px;
    position: relative;
  }

  /* Conic gradient "lamp beam" */
  .lamp-cone::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 420px;
    background: linear-gradient(to bottom, var(--lamp-glow2), transparent);
    box-shadow: 0 0 80px 80px rgba(99,102,241,0.18), 0 0 200px 200px rgba(99,102,241,0.06);
    border-radius: 50%;
  }

  /* Top horizontal line */
  .lamp-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lamp-line::before,
  .lamp-line::after {
    content: '';
    flex: 1;
    height: 1.5px;
    background: linear-gradient(to var(--dir), var(--lamp-glow2), transparent);
    max-width: 45%;
    opacity: 0;
    animation: lineReveal 1s 0.2s ease forwards;
  }
  .lamp-line::before { --dir: left; }
  .lamp-line::after  { --dir: right; }

  @keyframes lineReveal {
    from { opacity: 0; transform: scaleX(0.2); }
    to   { opacity: 1; transform: scaleX(1); }
  }

  /* Glow orb at center top */
  .lamp-orb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--lamp-glow2);
    box-shadow: 0 0 24px 8px var(--lamp-glow2), 0 0 60px 30px rgba(129,140,248,0.5);
    flex-shrink: 0;
    opacity: 0;
    animation: orbPop 0.6s 0.5s ease forwards;
  }

  @keyframes orbPop {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Wide radial glow below the orb */
  .lamp-glow-spread {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 340px;
    background: radial-gradient(ellipse 55% 70% at 50% 0%, rgba(99,102,241,0.22) 0%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    animation: glowFade 1.2s 0.4s ease forwards;
  }

  @keyframes glowFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── HERO TEXT ── */
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 1.5rem;
    margin-top: 60px;
    opacity: 0;
    transform: translateY(40px);
    animation: textRise 0.9s 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes textRise {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(3rem, 9vw, 6.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    background: linear-gradient(160deg, #e0e7ff 30%, #a5b4fc 70%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-tagline {
    display: block;
    margin-top: 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.95rem, 2.5vw, 1.25rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0.85;
  }

  /* ── SCROLL ARROW ── */
  .scroll-cta {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    opacity: 0;
    animation: ctaFade 1s 1.4s ease forwards;
    transition: opacity 0.3s;
  }
  .scroll-cta:hover { opacity: 0.85 !important; }

  @keyframes ctaFade {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to   { opacity: 0.55; transform: translateX(-50%) translateY(0); }
  }

  .scroll-cta span {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .scroll-arrow {
    width: 24px;
    height: 24px;
    border-right: 1.5px solid var(--text-secondary);
    border-bottom: 1.5px solid var(--text-secondary);
    transform: rotate(45deg);
    animation: bounce 1.6s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50%       { transform: rotate(45deg) translateY(5px); }
  }

  /* ── SEAMLESS TRANSITION FADE ── */
  #apush-hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(to bottom, transparent, var(--site-bg, #ffffff));
    pointer-events: none;
    z-index: 10;
  }

  /* ── SITE CONTENT WRAPPER ── */
  #site-content {
    position: relative;
    z-index: 1;
  }

  /* Subtle star field */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--dur) var(--delay) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50%       { opacity: var(--peak); }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     LAMP HERO — Insert at very top of your HTML body
     ═══════════════════════════════════════════════ -->
<section id="apush-hero">

  <!-- Starfield background -->
  <div class="stars" id="stars"></div>

  <!-- Lamp apparatus -->
  <div class="lamp-wrap" aria-hidden="true">
    <div class="lamp-cone">
      <div class="lamp-line">
        <div class="lamp-orb"></div>
      </div>
      <div class="lamp-glow-spread"></div>
    </div>
  </div>

  <!-- Hero text -->
  <div class="hero-content">
    <h1 class="hero-title">APUSH HUB</h1>
    <span class="hero-tagline">AP US History Made Easy</span>
  </div>

  <!-- Scroll prompt -->
  <button class="scroll-cta" onclick="scrollToSite()" aria-label="Scroll to content">
    <span>Explore</span>
    <div class="scroll-arrow"></div>
  </button>

</section>
<!-- ═══ END HERO ═══ -->


<!-- ═══════════════════════════════════════════════
     YOUR EXISTING SITE CONTENT GOES BELOW HERE
     (wrap it in <div id="site-content">...</div>)
     ═══════════════════════════════════════════════ -->
<div id="site-content">

  <!-- DEMO PLACEHOLDER — replace with your actual site HTML -->
  <div style="min-height:100vh; background:#fff; display:flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; color:#1e1b4b; font-size:1.5rem; padding:2rem; text-align:center;">
    ✦ &nbsp; Your existing APUSH website content appears here &nbsp; ✦
  </div>

</div>


<script>
  /* ── Generate starfield ── */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top:  ${Math.random() * 100}%;
      --dur:   ${2 + Math.random() * 4}s;
      --delay: ${Math.random() * 5}s;
      --peak:  ${0.1 + Math.random() * 0.5};
    `;
    starsEl.appendChild(s);
  }

  /* ── Smooth scroll into site ── */
  function scrollToSite() {
    document.getElementById('site-content').scrollIntoView({ behavior: 'smooth' });
  }

  /* ── Detect site background color for seamless fade ──
     (reads first element below hero and matches its bg)  */
  window.addEventListener('load', () => {
    const siteEl = document.getElementById('site-content').firstElementChild;
    if (siteEl) {
      const bg = getComputedStyle(siteEl).backgroundColor;
      if (bg && bg !== 'rgba(0, 0, 0, 0)') {
        document.documentElement.style.setProperty('--site-bg', bg);
      }
    }
  });
</script>

</body>
</html>
