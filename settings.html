<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - APUSH Review</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">APUSH Review</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="timeline.html">Timeline</a>
            <a href="flashcards.html">Flashcards</a>
            <a href="quiz.html">Quiz</a>
            <a href="settings.html" class="settings-icon"><i class="fas fa-gear"></i></a>
        </div>
    </nav>

    <main class="main-content">
        <h1><i class="fas fa-gear"></i> Settings</h1>

        <div class="settings-container">
            <div class="setting-item">
                <label for="dark-mode">Dark Mode</label>
                <label class="switch">
                    <input type="checkbox" id="dark-mode" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <label for="font-size">Font Size</label>
                <select id="font-size" class="setting-select">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="quiz-count">Questions per Quiz</label>
                <select id="quiz-count" class="setting-select">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="shuffle">Shuffle Flashcards</label>
                <label class="switch">
                    <input type="checkbox" id="shuffle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-actions">
                <button class="btn" onclick="saveSettings()">Save Settings</button>
                <button class="btn btn-secondary" onclick="resetSettings()">Reset Defaults</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
